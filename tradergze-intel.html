<style>
:root {
  --bg: #0d1014; --panel: #141920; --panel-2: #1a2029; --line: #232b35; --text: #d9dfe7; --muted: #7f8b99;
  --brand: #26b585; --up: #26b585; --down: #e5534b; --gold: #e8a838; --blue: #60a5fa; --violet: #a78bfa; --orange: #fb923c;
  --mono: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
:root[data-theme="light"] { --bg: #f4f6fa; --panel: #fff; --panel-2: #eef2f7; --line: #d8dfea; --text: #0f172a; --muted: #5b6577; --brand: #059669; --up: #15803d; --down: #be123c; --gold: #b45309; --blue: #1d4ed8; --violet: #6d28d9; --orange: #c2410c; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 var(--sans); }
a { color: var(--blue); text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
header.top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 10px; padding: 9px 14px 6px; }
.logo { width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--line); flex: none; }
.word { display: block; height: 16px; filter: invert(1); }
:root[data-theme="light"] .word { filter: none; }
.brand small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 3px; }
.brand small b { color: var(--brand); font-weight: 600; }
.live-dot { margin-left: auto; display: flex; align-items: center; gap: 6px; font: 12px var(--mono); color: var(--muted); }
.live-dot i { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.live-dot.on i { background: var(--up); box-shadow: 0 0 0 0 var(--up); animation: pulse 1.6s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--up) 60%, transparent); } 100% { box-shadow: 0 0 0 9px transparent; } }
.icon-btn { border: 1px solid var(--line); background: var(--panel); border-radius: 9px; width: 34px; height: 34px; display: grid; place-items: center; }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; padding: 0 10px 8px; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs a { flex: none; padding: 6px 12px; border-radius: 99px; color: var(--muted); border: 1px solid transparent; font-size: 14px; }
nav.tabs a.on { color: var(--text); background: var(--panel-2); border-color: var(--line); }
nav.tabs a .n { font: 11px var(--mono); background: var(--down); color: #fff; border-radius: 99px; padding: 0 5px; margin-left: 4px; }
main { max-width: 900px; margin: 0 auto; padding: 12px 14px calc(30px + var(--safe-b)); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 13px; margin-bottom: 12px; min-width: 0; }
.card h3 { margin: 0 0 8px; font-size: 12px; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 8px; }
.card h3 .r { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 400; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1 1 160px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 10px; }
.stat .v { font: 600 17px var(--mono); }
.stat .k { color: var(--muted); font-size: 12px; }
input, select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; outline: 0; min-width: 0; width: 100%; }
select { width: auto; }
input:focus, select:focus { border-color: var(--brand); }
.btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 10px; padding: 8px 13px; cursor: pointer; white-space: nowrap; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #032016; font-weight: 700; }
.btn.small { padding: 5px 9px; font-size: 13px; border-radius: 8px; }
.btn:disabled { opacity: .5; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel-2); white-space: nowrap; }
.chip.ok { color: var(--up); } .chip.err { color: var(--down); } .chip.wait { color: var(--gold); }
.muted { color: var(--muted); } .mono { font-family: var(--mono); } .up { color: var(--up); } .down { color: var(--down); } .gold { color: var(--gold); }
.small { font-size: 13px; }
.ev { display: grid; grid-template-columns: 6px 1fr; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.ev:last-child { border-bottom: 0; }
.ev .side { border-radius: 3px; }
.b-bullish { background: var(--up); } .b-bearish { background: var(--down); } .b-neutral { background: var(--muted); }
.ev .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.ev .amt { font: 600 15px var(--mono); }
.ev .path { font-size: 13px; color: var(--muted); word-break: break-word; }
.ev .path b { color: var(--text); font-weight: 500; }
.ev .note { font-size: 13px; margin-top: 2px; }
.sev { font: 700 11px var(--mono); padding: 2px 7px; border-radius: 6px; text-transform: uppercase; letter-spacing: .4px; }
.sev.critical { background: var(--down); color: #fff; } .sev.high { background: var(--orange); color: #111; } .sev.medium { background: var(--gold); color: #111; } .sev.low { background: var(--panel-2); color: var(--muted); }
.flowbar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--panel-2); margin: 6px 0 2px; }
.flowbar i { display: block; height: 100%; }
.map-wrap { height: 58vh; min-height: 330px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); overflow: hidden; position: relative; touch-action: none; }
.map-wrap svg { width: 100%; height: 100%; display: block; }
@keyframes flow { to { stroke-dashoffset: -24; } }
.fl { animation: flow 1.2s linear infinite; }
.pulse-box { height: 120px; position: relative; overflow: hidden; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
.bub { position: absolute; border-radius: 50%; display: grid; place-items: center; font: 600 10px var(--mono); color: #fff; animation: rise 14s linear forwards; opacity: .9; }
@keyframes rise { from { transform: translateY(0); } to { transform: translateY(-160px); opacity: 0; } }
table { width: 100%; border-collapse: collapse; font: 12.5px var(--mono); }
th, td { padding: 6px 6px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; }
th:first-child, td:first-child { text-align: left; }
.scroll { overflow-x: auto; }
.mk { padding: 9px 0; border-bottom: 1px solid var(--line); }
.mk:last-child { border-bottom: 0; }
.odds { height: 8px; border-radius: 4px; background: var(--panel-2); overflow: hidden; margin-top: 5px; }
.odds i { display: block; height: 100%; background: var(--blue); }
.err { border: 1px solid var(--down); color: var(--down); background: color-mix(in srgb, var(--down) 8%, transparent); padding: 9px 11px; border-radius: 10px; margin: 6px 0; font-size: 14px; }
.note-box { border: 1px dashed var(--line); border-radius: 10px; padding: 9px 11px; color: var(--muted); font-size: 13px; margin: 6px 0; }
.brief { white-space: pre-wrap; line-height: 1.55; }
.diag { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.hide { display: none !important; }
.toast { position: fixed; left: 50%; bottom: calc(18px + var(--safe-b)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 99px; font-size: 14px; z-index: 30; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 92vw; }
.toast.show { opacity: 1; }
label.sw { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
label.sw input { width: auto; }
.wl { width: 100%; border-collapse: collapse; font: 13px/1.3 var(--mono); }
.wl th { text-align: right; color: var(--muted); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.wl th:first-child, .wl td:first-child { text-align: left; }
.wl td { text-align: right; padding: 7px 8px; border-bottom: 1px solid var(--panel-2); white-space: nowrap; }
.wl tr.g td { background: var(--panel-2); color: var(--gold); font-weight: 600; text-align: left; letter-spacing: .04em; text-transform: uppercase; font-size: 11px; }
.wl tr.r { cursor: pointer; } .wl tr.r:hover td { background: var(--panel-2); }
.wl .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; vertical-align: middle; }
.dot.open { background: var(--up); } .dot.extended { background: var(--gold); } .dot.closed, .dot.unknown { background: var(--down); }
.wl .nm { color: var(--muted); font-family: var(--sans); font-size: 12px; } .wlwrap { overflow-x: auto; margin: 0 -6px; }
@media (max-width: 560px) { .wl .hm { display: none; } }
.zbar { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; } .zbar .btn { min-width: 34px; }
.zc { touch-action: pan-y; cursor: grab; user-select: none; } .zc:active { cursor: grabbing; }
</style>
</head>

<script>
// TraderGze Intel engine: live whale flows for BTC, USDT and USDC, top BTC holders, perp traders,
// prediction markets and an anomaly agent. Pure functions plus thin network readers; runs in the
// browser and in Node 18+ (tests swap Net.fetch and the WebSocket class).
(function (root) {
  "use strict";
  const I = {};

  // ================================================================ network

  const Net = {
    fetch: (...a) => fetch(...a),
    WS: typeof WebSocket !== "undefined" ? WebSocket : null,
    next: {},
    gaps: { "api.hyperliquid.xyz": 120, "mempool.space": 220, "api.trongrid.io": 400, "gamma-api.polymarket.com": 200, "api.elections.kalshi.com": 300 },
    async slot(host) {
      const gap = this.gaps[host] != null ? this.gaps[host] : 120;
      const now = Date.now(), at = Math.max(now, this.next[host] || 0);
      this.next[host] = at + gap;
      if (at > now) await new Promise((r) => setTimeout(r, at - now));
    },
    async request(url, init, as = "json") {
      const host = new URL(url).host;
      let last;
      for (let i = 0; i < 3; i++) {
        await this.slot(host);
        let res;
        try { res = await this.fetch(url, init); } catch (e) { last = new Error(`${host}: could not connect (${e.message || e})`); await sleep(800 * (i + 1)); continue; }
        if (res.status === 429 || res.status >= 500) { last = new Error(`${host} answered HTTP ${res.status}`); await sleep(1500 * (i + 1)); continue; }
        if (!res.ok) { let t = ""; try { t = (await res.text()).slice(0, 200); } catch {} throw new Error(`${host} answered HTTP ${res.status}${t ? ": " + t : ""}`); }
        return as === "json" ? res.json() : res.text();
      }
      throw last;
    },
    get(url, as) { return this.request(url, undefined, as); },
    post(url, body, headers = {}) { return this.request(url, { method: "POST", headers: Object.assign({ "Content-Type": "application/json" }, headers), body: JSON.stringify(body) }); },
  };
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  I.Net = Net;

  // ================================================================ settings

  const Settings = {
    btcMin: 100,            // BTC: report transfers at or above this
    stableMin: 5e6,         // USDT/USDC: report at or above this many dollars
    perpMin: 1e6,           // Hyperliquid: a "big trade" in dollars
    chains: { ethereum: true, bsc: true, polygon: true, tron: true },
    rpc: { ethereum: "https://ethereum-rpc.publicnode.com", bsc: "https://bsc-rpc.publicnode.com", polygon: "https://polygon-bor-rpc.publicnode.com" },
    anthropicKey: "", trongridKey: "",
    labels: {},             // your own: address -> [name, kind]
    holders: [],            // extra BTC addresses you watch
  };
  I.Settings = Settings;

  // ================================================================ formatting

  const fmtUsd = (x) => (x == null || !isFinite(x) ? "—" : Math.abs(x) >= 1e9 ? `$${(x / 1e9).toFixed(2)}B` : Math.abs(x) >= 1e6 ? `$${(x / 1e6).toFixed(1)}M` : Math.abs(x) >= 1e3 ? `$${(x / 1e3).toFixed(0)}k` : `$${x.toFixed(0)}`);
  const fmtNum = (x, d = 2) => (x == null || !isFinite(x) ? "—" : Number(x).toLocaleString("en-US", { maximumFractionDigits: d }));
  const short = (a) => (a && a.length > 14 ? `${a.slice(0, 6)}…${a.slice(-4)}` : a || "?");
  Object.assign(I, { fmtUsd, fmtNum, short });

  // ================================================================ labels

  // Public, widely cited wallets. kind: exchange | treasury | gov | hacker | dormant | custodian | bridge
  const LABELS = {
    // Bitcoin
    "1NDyJtNTjmwk5xPNhjgAMu4HDHigtobu1s": ["Binance hot wallet", "exchange", "Binance"],
    "34xp4vRoCGJym3xR7yCVPFHoCNxv4Twseo": ["Binance cold wallet", "exchange", "Binance"],
    "3M219KR5vEneNb47ewrPfWyb5jQ2DjxRP6": ["Binance cold wallet", "exchange", "Binance"],
    "bc1qm34lsc65zpw79lxes69zkqmk6ee3ewf0j77s3h": ["Binance wallet", "exchange", "Binance"],
    "bc1qgdjqv0av3q56jvd82tkdjpy7gdp9ut8tlqmgrpmv24sq90ecnvqqjwvw97": ["Bitfinex cold wallet", "exchange", "Bitfinex"],
    "bc1ql49ydapnjafl5t2cp9zqpjwe6pdgmxy98859v2": ["Robinhood custody", "custodian", "Robinhood"],

  /** Net change of an address over windows, from its recent transactions (mempool.space format). */
  function netChange(address, txs, now = Date.now() / 1000) {
    const W = { d1: 86400, d7: 7 * 86400, d30: 30 * 86400 };
    const res = { d1: 0, d7: 0, d30: 0, lastMove: null, recent: [] };
    for (const t of txs) {
      const time = (t.status && t.status.block_time) || now;
      const inV = (t.vin || []).filter((v) => v.prevout && v.prevout.scriptpubkey_address === address).reduce((s, v) => s + v.prevout.value, 0);
      const outV = (t.vout || []).filter((o) => o.scriptpubkey_address === address).reduce((s, o) => s + o.value, 0);
      const delta = (outV - inV) / 1e8;
      if (res.lastMove == null || time > res.lastMove) res.lastMove = time;
      for (const [k, w] of Object.entries(W)) if (now - time <= w) res[k] += delta;
      if (res.recent.length < 8) res.recent.push({ txid: t.txid, time, delta, pending: !(t.status && t.status.confirmed) });
    }
    return res;

  async function asterMarket(symbol = "BTCUSDT") {

  // ================================================================ macro: calendar and prediction markets

  // FOMC decision days (second day of each meeting), 2026 schedule. Add later years from federalreserve.gov.
  const FOMC = ["2026-01-28", "2026-03-18", "2026-04-29", "2026-06-17", "2026-07-29", "2026-09-16", "2026-10-28", "2026-12-09"];

const status = {};

function drawLive() { const on = running && Object.values(status).some((s) => /^live/.test(s)); $("#livedot").classList.toggle("on", on); $("#livetxt").textContent = running ? (on ? "live" : "connecting") : "off"; }
function addEvents(list) {
  const fresh = [];
  const ids = new Set(DB.events.slice(-500).map((e) => e.id));
  for (const e of list) if (!ids.has(e.id)) { DB.events.push(e); fresh.push(e); }
  if (DB.events.length > MAX_EVENTS) DB.events = DB.events.slice(-MAX_EVENTS);
  for (const e of fresh) {
    const hist = DB.events.slice(-300);
    addAnomalies(X.detect(e, hist));
    if (e.asset === "BTC" && e.amount >= Math.max(X.Settings.btcMin * 2, 200)) checkAge(e);
  }
  if (fresh.length) { save(); if (["live", "map"].includes(route.cur)) liveRefresh(fresh); }
}
async function checkAge(e) {
  await new Promise((r) => setTimeout(r, 8000));   // let mempool.space index the transaction
  try {
    const oldest = await X.coinAge(e.hash);
    if (!oldest) return;
    e.coinAgeYears = (e.time - oldest) / (365.25 * 86400);
    if (e.coinAgeYears >= 3) addAnomalies(X.detect(e, []).filter((a) => /dormant/.test(a.title)));
    save();
  } catch {}
}
function addAnomalies(list) {
  const ids = new Set(DB.anomalies.map((a) => a.id));
  let n = 0;
  for (const a of list) {
    if (ids.has(a.id)) continue;
    DB.anomalies.push(a); n++;
    if (DB.notify && (a.severity === "critical" || a.severity === "high")) notify(a);
  }
  if (DB.anomalies.length > MAX_ANOM) DB.anomalies = DB.anomalies.slice(-MAX_ANOM);

}

  try { const ac = new AudioContext(), o = ac.createOscillator(); o.frequency.value = a.severity === "critical" ? 990 : 660; o.connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.18); } catch {}
}

function drawMap() {
  const svg = $("#map"); if (!svg) return;
  const now = Date.now() / 1000;
  const ev = DB.events.filter((e) => e.chain !== "hyperliquid" && now - e.time <= mapOpt.hours * 3600 && (mapOpt.asset === "all" || (mapOpt.asset === "BTC" ? e.asset === "BTC" : e.asset !== "BTC")));
  const ent = (e, side) => e[side + "Entity"] || (side === "from" && e.type === "mint" ? "Mint" : "Unknown wallets");
  const edges = new Map(), totals = new Map();
  for (const e of ev) {
    const a = ent(e, "from"), b = ent(e, "to");
    if (a === b && a === "Unknown wallets") { totals.set(a, (totals.get(a) || 0) + (e.usd || 0)); continue; }
    const k = a + "→" + b;
    const x = edges.get(k) || { a, b, usd: 0, n: 0, type: e.type };
    x.usd += e.usd || 0; x.n++; edges.set(k, x);
    totals.set(a, (totals.get(a) || 0) + (e.usd || 0)); totals.set(b, (totals.get(b) || 0) + (e.usd || 0));
  }
  if (!totals.has("Unknown wallets")) totals.set("Unknown wallets", 0);
  const names = [...totals.keys()].filter((n) => n !== "Unknown wallets").sort((a, b) => totals.get(b) - totals.get(a)).slice(0, 14);
  const W = 400, H = 400, cx = 200, cy = 200, R = 150, pos = { "Unknown wallets": { x: cx, y: cy } };
  names.forEach((n, i) => { const t = (2 * Math.PI * i) / Math.max(names.length, 1) - Math.PI / 2; pos[n] = { x: cx + R * Math.cos(t), y: cy + R * Math.sin(t) }; });
  const maxE = Math.max(1, ...[...edges.values()].map((e) => e.usd)), maxN = Math.max(1, ...totals.values());
  let s = "";
  for (const e of [...edges.values()].sort((x, y) => x.usd - y.usd)) {
    const p = pos[e.a], q = pos[e.b]; if (!p || !q) continue;
    const w = 1 + 9 * Math.sqrt(e.usd / maxE), mx = (p.x + q.x) / 2 + (q.y - p.y) * 0.18, my = (p.y + q.y) / 2 - (q.x - p.x) * 0.18;
    // end the line at the target circle's edge so it doesn't run through the label
    const rq = 7 + 16 * Math.sqrt((totals.get(e.b) || 0) / maxN) + 4, dx = q.x - mx, dy = q.y - my, dl = Math.hypot(dx, dy) || 1;
    const ex = q.x - (dx / dl) * rq, ey = q.y - (dy / dl) * rq;
    const col = e.type === "inflow" ? "var(--down)" : e.type === "outflow" ? "var(--up)" : e.type === "mint" ? "var(--gold)" : "var(--blue)";
    s += `<path d="M${p.x} ${p.y} Q${mx} ${my} ${ex.toFixed(1)} ${ey.toFixed(1)}" fill="none" stroke="${col}" stroke-opacity=".55" stroke-width="${w.toFixed(1)}" stroke-linecap="round" class="fl" stroke-dasharray="6 6"><title>${esc(e.a)} → ${esc(e.b)}: ${X.fmtUsd(e.usd)} in ${e.n} transfers</title></path>`;
  }
  for (const n of ["Unknown wallets", ...names]) {
    const p = pos[n], r = 7 + 16 * Math.sqrt((totals.get(n) || 0) / maxN), c = n === "Unknown wallets" ? "var(--muted)" : n === "Mint" || n === "Tether" || n === "Circle" ? "var(--gold)" : "var(--blue)";
    s += `<circle cx="${p.x}" cy="${p.y}" r="${r.toFixed(1)}" fill="var(--panel)" stroke="${c}" stroke-width="2.5"/><text x="${p.x}" y="${p.y + r + 13}" text-anchor="middle" font-size="11" fill="var(--text)">${esc(n)}</text><text x="${p.x}" y="${p.y + r + 25}" text-anchor="middle" font-size="9.5" fill="var(--muted)" font-family="var(--mono)">${X.fmtUsd(totals.get(n) || 0)}</text>`;
  }
  if (!ev.length) s += `<text x="${cx}" y="${cy + 50}" text-anchor="middle" fill="var(--muted)" font-size="13">No transfers recorded in this window yet.</text>`;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = s;
  const r = $("#routes");
  if (r) r.innerHTML = [...edges.values()].sort((a, b) => b.usd - a.usd).slice(0, 10).map((e) => `<div class="row small" style="justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line)"><span>${esc(e.a)} → <b>${esc(e.b)}</b> <span class="muted">${e.n}×</span></span><b class="mono">${X.fmtUsd(e.usd)}</b></div>`).join("") || '<p class="muted small">Nothing yet.</p>';
}

const pct = (x, d = 0) => (x == null || !isFinite(x) ? "—" : `${(x * 100).toFixed(d)}%`);

/** Candles with trade markers. marks: [{t, px, kind: "long"|"short"|"exit", label}], lines: [{y, color, label}] */
function candleSvg(bars, marks = [], lines = [], H = 300) {
  if (!bars.length) return '<p class="muted small">No price data yet.</p>';
  const W = 900, pr = 70, pb = 20, n = bars.length, bw = (W - pr) / n;
  const hi = Math.max(...bars.map((b) => b.h), ...lines.map((l) => l.y)), lo = Math.min(...bars.map((b) => b.l), ...lines.map((l) => l.y));
  const y = (v) => 8 + ((hi - v) / (hi - lo || 1)) * (H - pb - 16), xi = (t) => { let k = bars.findIndex((b) => b.t > t); k = k < 0 ? n - 1 : Math.max(0, k - 1); return k * bw + bw / 2; };
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="BTC price with trades">`;
  for (let k = 0; k <= 4; k++) { const v = lo + ((hi - lo) * k) / 4; s += `<line x1="0" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${W - pr + 4}" y="${y(v) + 4}" font-size="11" fill="var(--muted)" font-family="var(--mono)">${fmtPx(v)}</text>`; }
  bars.forEach((b, i) => { const c = b.c >= b.o ? "var(--up)" : "var(--down)", x = i * bw + bw / 2; s += `<line x1="${x}" x2="${x}" y1="${y(b.h)}" y2="${y(b.l)}" stroke="${c}" stroke-width="${Math.max(0.6, bw * 0.15)}"/><rect x="${x - Math.max(0.5, bw * 0.35)}" width="${Math.max(1, bw * 0.7)}" y="${Math.min(y(b.o), y(b.c))}" height="${Math.max(0.8, Math.abs(y(b.o) - y(b.c)))}" fill="${c}"/>`; });
  for (const l of lines) s += `<line x1="0" x2="${W - pr}" y1="${y(l.y)}" y2="${y(l.y)}" stroke="${l.color}" stroke-dasharray="5 4"/><text x="4" y="${y(l.y) - 3}" font-size="11" fill="${l.color}">${esc(l.label)} ${fmtPx(l.y)}</text>`;
  for (const m of marks) { const x = xi(m.t), yy = y(m.px); s += m.kind === "exit" ? `<circle cx="${x}" cy="${yy}" r="5" fill="none" stroke="var(--gold)" stroke-width="2"><title>${esc(m.label || "")}</title></circle>` : `<path d="M${x - 6} ${m.kind === "long" ? yy + 9 : yy - 9} L${x + 6} ${m.kind === "long" ? yy + 9 : yy - 9} L${x} ${yy}Z" fill="${m.kind === "long" ? "var(--up)" : "var(--down)"}"><title>${esc(m.label || "")}</title></path>`; }
  [0, Math.floor(n / 2), n - 1].forEach((i) => (s += `<text x="${i * bw}" y="${H - 4}" font-size="11" fill="var(--muted)" text-anchor="${i ? (i === n - 1 ? "end" : "middle") : "start"}">${new Date(bars[i].t * 1000).toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit" })}</text>`));
  return s + "</svg>";
}
const fmtPx = (v) => v == null || !isFinite(v) ? "—" : Math.abs(v) >= 1000 ? v.toLocaleString(undefined, { maximumFractionDigits: 0 }) : Math.abs(v) >= 10 ? v.toFixed(2) : v.toFixed(4);
const sparkSvg = (pts, up) => { if (!pts || pts.length < 2) return ""; const lo = Math.min(...pts), hi = Math.max(...pts), W = 80, H = 22; return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><path d="${pts.map((p, i) => `${i ? "L" : "M"}${((i / (pts.length - 1)) * W).toFixed(1)},${(1 + ((hi - p) / (hi - lo || 1)) * (H - 2)).toFixed(1)}`).join("")}" fill="none" stroke="${up ? "var(--up)" : "var(--down)"}" stroke-width="1.4"/></svg>`; };
const emaLine = (bars, n) => { const k = 2 / (n + 1); let e = null; return bars.map((b) => (e = e == null ? b.c : b.c * k + e * (1 - k))); };

/** el gets a chart you can zoom (wheel, + / −, double-tap) and move (drag). render(i0, i1) returns the SVG for points i0..i1-1. */
function zoomChart(el, n, render, { min = 15, start } = {}) {
  if (!n) { el.innerHTML = render(0, 0); return; }
  let i0 = start != null ? Math.max(0, n - start) : 0, i1 = n;
  el.innerHTML = `<div class="zbar"><button class="btn small" data-z="in" aria-label="Zoom in">+</button><button class="btn small" data-z="out" aria-label="Zoom out">−</button><button class="btn small" data-z="left" aria-label="Back">◀</button><button class="btn small" data-z="right" aria-label="Forward">▶</button><button class="btn small" data-z="all">All</button><span class="small muted">drag to move · wheel or + to zoom</span></div><div class="zc"></div>`;
  const box = el.querySelector(".zc");
  const draw = () => { box.innerHTML = render(i0, i1); };
  const zoom = (f, at = 0.5) => { const w = i1 - i0, nw = Math.max(min, Math.min(n, Math.round(w * f))), c = i0 + w * at; i0 = Math.round(c - nw * at); i1 = i0 + nw; clamp(); draw(); };

  const clamp = () => { const w = i1 - i0; if (i0 < 0) { i0 = 0; i1 = w; } if (i1 > n) { i1 = n; i0 = Math.max(0, n - w); } };

  let drag = null;
  box.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, i0, i1 }; box.setPointerCapture(e.pointerId); });
  box.addEventListener("pointermove", (e) => { if (!drag) return; const r = box.getBoundingClientRect(), d = Math.round(((drag.x - e.clientX) / r.width) * (drag.i1 - drag.i0)); if (d) { i0 = drag.i0 + d; i1 = drag.i1 + d; clamp(); draw(); } });

}

  const W = 900, pr = 60, mid = H / 2, n = daily.length, bw = (W - pr) / n, mx = Math.max(1, ...daily.map((d) => Math.max(d.in, d.out)));
  let s = `<svg viewBox="0 0 ${W} ${H + 16}" width="100%"><line x1="0" x2="${W - pr}" y1="${mid}" y2="${mid}" stroke="var(--line)"/><text x="${W - pr + 4}" y="12" font-size="11" fill="var(--muted)" font-family="var(--mono)">${X.fmtUsd(mx)}</text>`;
  daily.forEach((d, i) => { const x = i * bw + bw * 0.12, w = bw * 0.76, hi = (d.in / mx) * (mid - 4), ho = (d.out / mx) * (mid - 4), t = new Date(d.t * 1000).toLocaleDateString(); if (hi) s += `<rect x="${x}" y="${mid - hi}" width="${w}" height="${hi}" fill="var(--up)"><title>${t} · in ${X.fmtUsd(d.in)}</title></rect>`; if (ho) s += `<rect x="${x}" y="${mid}" width="${w}" height="${ho}" fill="var(--down)"><title>${t} · out ${X.fmtUsd(d.out)}</title></rect>`; if (!hi && !ho && d.n) s += `<circle cx="${x + w / 2}" cy="${mid}" r="2" fill="var(--muted)"><title>${t} · ${d.n} tx</title></circle>`; });
  [0, n - 1].forEach((i) => (s += `<text x="${i * bw}" y="${H + 14}" font-size="11" fill="var(--muted)" text-anchor="${i ? "end" : "start"}">${new Date(daily[i].t * 1000).toLocaleDateString(undefined, { month: "short", day: "numeric" })}</text>`));
  return s + "</svg>";
}

  ["GC=F", "SI=F", "Gold vs Silver", "Silver is higher-beta gold with an industrial side. Silver leading gold up = risk appetite; lagging = defensive bid."],

  ["^TNX", "^GSPC", "US 10-year yield vs S&P 500", "The stock-bond correlation sets the macro regime: positive when growth drives yields, negative when inflation does."],

function corr(a, b) { const n = a.length; if (n < 3) return null; const ma = a.reduce((s, x) => s + x, 0) / n, mb = b.reduce((s, x) => s + x, 0) / n; let c = 0, va = 0, vb = 0; for (let i = 0; i < n; i++) { c += (a[i] - ma) * (b[i] - mb); va += (a[i] - ma) ** 2; vb += (b[i] - mb) ** 2; } return va && vb ? c / Math.sqrt(va * vb) : null; }
async function drawPair(el, a, b, range = "1Y", win = 60) {
  el.innerHTML = '<p class="muted small">Loading…</p>';
  try {
    const [A, B] = await Promise.all([api(`/api/chart?symbol=${encodeURIComponent(a)}&range=${range}`), api(`/api/chart?symbol=${encodeURIComponent(b)}&range=${range}`)]);
    const day = (t) => Math.floor(t / 86400), mb = new Map(B.bars.map((x) => [day(x.t), x.c])), pts = A.bars.filter((x) => mb.has(day(x.t))).map((x) => [x.t, x.c, mb.get(day(x.t))]);
    if (pts.length < win + 5) throw new Error("not enough overlapping history");
    const ra = pts.slice(1).map((p, i) => Math.log(p[1] / pts[i][1])), rb = pts.slice(1).map((p, i) => Math.log(p[2] / pts[i][2]));
    const roll = []; for (let i = win; i <= ra.length; i++) roll.push([pts[i][0], +(corr(ra.slice(i - win, i), rb.slice(i - win, i)) || 0).toFixed(3)]);
    const all = corr(ra, rb) || 0, now = roll[roll.length - 1][1];
    el.innerHTML = `<div class="row small" style="justify-content:space-between"><span><i style="display:inline-block;width:10px;height:3px;background:var(--blue)"></i> ${esc(A.meta.name || a)} &nbsp; <i style="display:inline-block;width:10px;height:3px;background:var(--gold)"></i> ${esc(B.meta.name || b)}</span><span class="muted">rebased to 100</span></div>
      ${curveSvg([{ name: a, color: "var(--blue)", pts: pts.map((p) => [p[0], (100 * p[1]) / pts[0][1]]) }, { name: b, color: "var(--gold)", pts: pts.map((p) => [p[0], (100 * p[2]) / pts[0][2]]) }], 200, false)}
      <div class="row small" style="justify-content:space-between;margin-top:6px"><b>${win}-day rolling correlation of daily returns</b><span>now <b class="${now >= 0 ? "up" : "down"}">${now.toFixed(2)}</b> · ${range} average ${all.toFixed(2)}</span></div>
      ${curveSvg([{ name: "correlation", color: "var(--violet)", pts: roll }], 130, false)}`;
  } catch (e) { el.innerHTML = `<div class="err small">${esc(e.message)}</div>`; }
}

Screens.settings = (root) => {
  const s = X.Settings;
  if (SERVER) api("/api/jobs").then((j) => { const el = $("#jobs"); if (el) el.textContent = j.text; }).catch(() => {});
  root.innerHTML = (SERVER ? `<div class="card"><h3>What the server is doing <span class="r small muted">also /jobs on Telegram</span></h3><pre id="jobs" class="small mono" style="white-space:pre-wrap;margin:0">Loading…</pre></div><div class="card"><h3>Download data</h3><p class="small muted" style="margin-top:0">CSV files open in Excel, Google Sheets or Numbers.</p>${DOWNLOADS.map(([k, n, d]) => `<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--panel-2)"><div><b class="small">${esc(n)}</b><div class="small muted">${esc(d)}</div></div><a class="btn small primary" href="/api/export?what=${k}" download>⬇</a></div>`).join("")}</div>` : "") + `<div class="card"><h3>What counts as a whale</h3><div class="grid2">
      <label class="small">BTC transfer at least<input id="s-btc" type="number" value="${s.btcMin}"></label>
      <label class="small">USDT/USDC transfer at least ($)<input id="s-st" type="number" value="${s.stableMin}"></label>
      <label class="small">Perp trade at least ($)<input id="s-pp" type="number" value="${s.perpMin}"></label></div></div>
    <div class="card"><h3>Chains for USDT / USDC</h3>${["ethereum", "bsc", "polygon", "tron"].map((c) => `<label class="sw"><input type="checkbox" data-c="${c}" ${s.chains[c] ? "checked" : ""}> ${X.CHAIN_NAME[c]}</label>`).join("")}
      <details class="small"><summary class="muted">RPC endpoints (advanced)</summary>${["ethereum", "bsc", "polygon"].map((c) => `<label class="small">${X.CHAIN_NAME[c]}<input class="mono" data-rpc="${c}" value="${esc(s.rpc[c])}"></label>`).join("")}<p class="muted">Any public JSON-RPC that allows browser requests works; a paid one (Alchemy, Infura, QuickNode) is more reliable for all-day tracking.</p></details></div>
    <div class="card"><h3>Keys (stay on this phone)</h3>
      <label class="small">Anthropic API key, for AI briefings<input id="s-ak" class="mono" value="${esc(s.anthropicKey)}" placeholder="sk-ant-…" autocomplete="off"></label>
      <p class="small muted">Get one at <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a>. Each briefing is one request to Claude Opus 5.5 billed to your account (usually a few cents). The key is sent only to api.anthropic.com from this browser; anyone with this phone unlocked could read it.</p>
      <label class="small">TronGrid key (optional, steadier Tron tracking)<input id="s-tk" class="mono" value="${esc(s.trongridKey)}" autocomplete="off"></label></div>
    <div class="card"><label class="sw"><input type="checkbox" id="s-auto" ${DB.autostart ? "checked" : ""}> Start live tracking when the app opens</label><label class="sw"><input type="checkbox" id="s-wake" ${DB.keepAwake ? "checked" : ""}> Keep the screen on while tracking</label>
      <p class="small muted">Phones pause pages in the background, so tracking runs while the app is open and the screen is on. Anything missed while closed is not back-filled.</p>
      <div class="row"><button class="btn primary" id="sv">Save</button><span id="svm" class="small muted"></span></div></div>
    <div class="card"><h3>Your labels</h3><p class="small muted" style="margin-top:0">Teach the agent wallets you know (e.g. an exchange deposit address). One per line: <span class="mono">address, name, kind</span> where kind is exchange, treasury, custodian or gov.</p>
      <textarea id="lab" rows="4" class="mono small" placeholder="0xabc…, Binance deposit, exchange">${esc(Object.entries(s.labels).map(([a, v]) => `${a}, ${v[0]}, ${v[1]}`).join("\n"))}</textarea><div class="row" style="margin-top:6px"><button class="btn small" id="labsv">Save labels</button></div></div>
    <div class="card"><h3>Your record</h3><p class="small muted" style="margin-top:0">${DB.events.length.toLocaleString()} transfers and ${DB.anomalies.length.toLocaleString()} anomalies stored on this phone (newest ${MAX_EVENTS.toLocaleString()} kept).</p>
      <div class="row"><button class="btn small" id="csv">Export CSV</button><button class="btn small" id="json">Export JSON</button><button class="btn small" id="wipe">Clear the record</button></div></div>
    <div class="card"><h3>Check the connections</h3><button class="btn" id="dg">Run the check</button><div id="dgo" style="margin-top:8px"></div></div>
    <div class="card"><h3>Install on Android</h3><ol class="small" style="margin:0;padding-left:18px"><li>Open this page's web address in Chrome.</li><li>⋮ menu → <b>Add to Home screen</b>.</li><li>It opens full-screen from the bear icon.</li></ol></div>
    <div class="card"><div class="row"><button class="btn small" data-th="dark">Dark</button><button class="btn small" data-th="light">Light</button></div></div>`;
  $("#sv").onclick = () => {
    s.btcMin = Math.max(1, +$("#s-btc").value || 100); s.stableMin = Math.max(1e4, +$("#s-st").value || 5e6); s.perpMin = Math.max(1e4, +$("#s-pp").value || 1e6);
    root.querySelectorAll("[data-c]").forEach((c) => (s.chains[c.dataset.c] = c.checked));
    root.querySelectorAll("[data-rpc]").forEach((c) => (s.rpc[c.dataset.rpc] = c.value.trim()));
    s.anthropicKey = $("#s-ak").value.trim(); s.trongridKey = $("#s-tk").value.trim();
    DB.autostart = $("#s-auto").checked; DB.keepAwake = $("#s-wake").checked;
    save(true); $("#svm").textContent = "Saved."; if (running) { stop(); start(); }
  };
  $("#labsv").onclick = () => { const out = {}; for (const line of $("#lab").value.split("\n")) { const [a, n, k] = line.split(",").map((x) => (x || "").trim()); if (a && n) { out[/^0x/i.test(a) ? a.toLowerCase() : a] = [n, k || "exchange", n.split(/\s/)[0]]; if (SERVER) api("/api/labels", { method: "POST", body: JSON.stringify({ address: a, name: n, kind: k || "exchange" }) }).catch(() => {}); } } s.labels = out; save(true); toast(`${Object.keys(out).length} labels saved`); };
  $("#csv").onclick = () => download("tradergze-whales.csv", "time,chain,asset,amount,usd,from,from_label,to,to_label,type,bias,tx\n" + DB.events.map((e) => [new Date(e.time * 1000).toISOString(), e.chain, e.asset, e.amount != null ? e.amount : e.sz, e.usd != null ? Math.round(e.usd) : "", e.from || "", e.fromLabel || "", e.to || "", e.toLabel || "", e.type, e.bias, e.hash].map((v) => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n"), "text/csv");
  $("#json").onclick = () => download("tradergze-record.json", JSON.stringify({ events: DB.events, anomalies: DB.anomalies }, null, 1), "application/json");
  $("#wipe").onclick = () => { if (confirm("Delete every recorded transfer and anomaly on this phone?")) { DB.events = []; DB.anomalies = []; save(true); Screens.settings(root); } };
  $("#dg").onclick = async () => { const o = $("#dgo"); o.innerHTML = ""; $("#dg").disabled = true; await X.diagnostics((r) => o.insertAdjacentHTML("beforeend", `<div class="diag"><span>${esc(r.name)}</span><span class="${r.ok ? "up" : "down"}" style="text-align:right">${r.ok ? `OK · ${r.ms} ms` : esc(r.error)}</span></div>`)); $("#dg").disabled = false; };
  root.querySelectorAll("[data-th]").forEach((b) => (b.onclick = () => { document.documentElement.dataset.theme = b.dataset.th; try { localStorage.setItem(KEY + ".theme", b.dataset.th); } catch {} }));
};

// ------------------------------------------------------------ boot
try { const t = localStorage.getItem(KEY + ".theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
badge();
route();
detectServer().then((st) => {
  SERVER = st;
  if (SERVER) { DB.events = []; DB.anomalies = []; startServerMode(); route(); }
  else if (DB.autostart) start();
});
document.addEventListener("visibilitychange", async () => { if (document.visibilityState === "visible" && running && DB.keepAwake && navigator.wakeLock) { try { wake = await navigator.wakeLock.request("screen"); } catch {} } });
</script>
</body>
</html>
